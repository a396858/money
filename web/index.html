<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f4f6f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>记账本</title>
<style>
  :root{
    --bg:#f4f6f8;
    --card:#ffffff;
    --line:#e8ebef;
    --text:#1b1f24;
    --text-2:#6b7280;
    --text-3:#9aa3ad;
    --brand:#2f6feb;
    --expense:#e5484d;
    --income:#12a594;
    --radius:16px;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
    font-size:15px;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
  input{font-family:inherit;}

  .app{
    min-height:100%;
    padding-bottom:calc(96px + var(--safe-b));
    max-width:520px;
    margin:0 auto;
  }

  /* ============ 顶栏 ============ */
  .topbar{
    display:flex;align-items:center;justify-content:center;gap:6px;
    padding:calc(14px + var(--safe-t)) 16px 10px;
    position:sticky;top:0;z-index:20;
    background:linear-gradient(180deg,var(--bg) 72%,rgba(244,246,248,0));
  }
  .month-nav{
    display:flex;align-items:center;gap:2px;
    background:var(--card);border-radius:999px;padding:4px;
    box-shadow:0 1px 2px rgba(16,24,40,.05),0 0 0 1px rgba(16,24,40,.03);
  }
  .month-nav button{
    width:34px;height:34px;border-radius:999px;
    display:grid;place-items:center;font-size:19px;color:var(--text-2);
    line-height:1;padding-bottom:2px;
  }
  .month-nav button:active{background:#f0f2f5;}
  .month-nav .label{
    min-width:104px;text-align:center;font-weight:600;font-size:15px;letter-spacing:.2px;
  }
  .topbar .right{
    position:absolute;right:16px;top:calc(14px + var(--safe-t));
    height:42px;display:flex;align-items:center;
  }
  .icon-btn{
    width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
    color:var(--text-2);background:var(--card);
    box-shadow:0 1px 2px rgba(16,24,40,.05),0 0 0 1px rgba(16,24,40,.03);
  }
  .icon-btn:active{background:#f0f2f5;}

  /* ============ 汇总卡 ============ */
  .summary{
    margin:6px 16px 0;
    background:var(--card);
    border-radius:var(--radius);
    padding:20px;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 0 0 1px rgba(16,24,40,.03);
  }
  .summary .cap{font-size:13px;color:var(--text-3);letter-spacing:.3px;}
  .summary .big{
    font-size:34px;font-weight:700;letter-spacing:-.8px;margin:6px 0 16px;
    font-variant-numeric:tabular-nums;
    color:var(--expense);
  }
  .split{
    display:flex;gap:0;border-top:1px solid var(--line);padding-top:14px;
  }
  .split > div{flex:1;}
  .split > div + div{border-left:1px solid var(--line);padding-left:16px;}
  .split .k{font-size:12px;color:var(--text-3);margin-bottom:3px;}
  .split .v{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;}
  .v.income{color:var(--income);}
  .v.expense{color:var(--expense);}
  .v.neutral{color:var(--text);}

  /* ============ 快捷分类栏（网格：一行 5 个） ============ */
  .quickbar{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    margin:8px 16px 0;
    padding:2px;
  }
  .qbtn{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    width:100%;padding:9px 0 7px;
    background:var(--card);border-radius:13px;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 0 0 1px rgba(16,24,40,.03);
    transition:transform .12s ease;
  }
  .qbtn:active{transform:scale(.93);}
  .qbtn .qe{font-size:20px;line-height:1;}
  .qbtn .qn{font-size:11px;color:var(--text-2);white-space:nowrap;}
  .qbtn.qmain{
    background:linear-gradient(145deg,#4a83ff,var(--brand));
    box-shadow:0 4px 12px rgba(47,111,235,.3);
  }
  .qbtn.qmain .qe{font-size:19px;}
  .qbtn.qmain .qn{color:#fff;font-weight:600;}
  /* 收入类分类按钮 */
  .qbtn.qinc{
    background:linear-gradient(150deg,#fff,#eefaf7);
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 0 0 1px rgba(18,165,148,.2);
  }
  .qbtn.qinc .qn{color:var(--income);font-weight:600;}
  /* 当前选中的分类 */
  .qbtn.on{
    background:#eef4ff;
    box-shadow:0 0 0 1.5px var(--brand) inset, 0 2px 6px rgba(47,111,235,.12);
  }
  .qbtn.on .qn{color:var(--brand);font-weight:600;}

  /* ============ 列表 ============ */
  .list-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:20px 16px 8px;padding:0 2px;
  }
  .list-head .t{font-size:13px;font-weight:600;color:var(--text-2);letter-spacing:.4px;}
  .list-head .count{font-size:12px;color:var(--text-3);font-weight:400;margin-left:6px;}

  .groups{margin:0 16px;}
  .group{margin-bottom:14px;}
  .group-head{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:0 4px 7px;font-size:12.5px;color:var(--text-3);
  }
  .group-head .d{font-weight:600;color:var(--text-2);}
  .group-head .s{font-variant-numeric:tabular-nums;}

  .items{
    background:var(--card);border-radius:14px;overflow:hidden;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 0 0 1px rgba(16,24,40,.03);
  }
  .item{
    display:flex;align-items:center;gap:12px;
    padding:13px 14px;position:relative;
  }
  .item + .item::before{
    content:"";position:absolute;left:58px;right:0;top:0;height:1px;background:var(--line);
  }
  .item:active{background:#fafbfc;}
  .item .ico{
    width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
    font-size:17px;background:#f2f4f7;flex-shrink:0;
  }
  .item .mid{flex:1;min-width:0;}
  .item .mid .c{font-weight:500;font-size:14.5px;}
  .item .mid .n{
    font-size:12.5px;color:var(--text-3);margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .item .amt{
    font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0;
    letter-spacing:-.2px;
  }
  .item .amt.expense{color:var(--expense);}
  .item .amt.income{color:var(--income);}

  .more-btn{
    display:block;width:100%;
    margin:2px 0 14px;
    padding:12px;
    background:var(--card);border-radius:13px;
    color:var(--brand);font-size:13.5px;font-weight:600;letter-spacing:.3px;
    box-shadow:0 1px 2px rgba(16,24,40,.04),0 0 0 1px rgba(16,24,40,.03);
  }
  .more-btn:active{background:#f7f9fc;}

  .empty{
    text-align:center;padding:56px 20px;color:var(--text-3);
  }
  .empty .e{font-size:40px;margin-bottom:12px;opacity:.55;}
  .empty .m{font-size:14px;line-height:1.7;}

  /* ============ 记一笔（常驻卡片） ============ */
  .entry{
    background:var(--card);
    border-radius:18px;
    margin:10px 16px 0;
    overflow:hidden;
    box-shadow:0 1px 2px rgba(16,24,40,.05),0 0 0 1px rgba(16,24,40,.04);
  }
  .entry .seg{margin:12px 14px 0;}
  .entry .amount-box{border-bottom:none;padding:12px 16px 6px;}
  .entry .amount-box .cap{
    display:flex;align-items:center;justify-content:space-between;
    font-size:12px;color:var(--text-3);margin-bottom:4px;
  }
  .cat-hint{
    font-size:12px;color:var(--text-2);background:#f1f4f8;
    border-radius:9px;padding:5px 9px;display:flex;align-items:center;gap:3px;
  }
  .cat-hint b{color:var(--brand);font-weight:600;}
  .cat-hint:active{background:#e7ecf4;}
  .entry .amount-line .val{font-size:34px;}
  .entry .meta{padding:8px 14px 12px;}

  /* 分类区标题 */
  .cat-head{
    display:flex;align-items:center;justify-content:space-between;
    margin:18px 18px 0;font-size:13px;color:var(--text-2);font-weight:600;
  }
  .cat-head .hint{font-size:12px;color:var(--text-3);font-weight:400;}

  /* ============ 底部弹层 ============ */
  .mask{
    position:fixed;inset:0;background:rgba(16,24,40,.42);
    opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:50;
    backdrop-filter:blur(2px);
  }
  .mask.on{opacity:1;pointer-events:auto;}

  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:60;
    background:var(--card);
    border-radius:22px 22px 0 0;
    transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,.24,1);
    max-width:520px;margin:0 auto;
    padding-bottom:var(--safe-b);
    max-height:94vh;display:flex;flex-direction:column;
  }
  .sheet.on{transform:translateY(0);}
  .sheet-grip{
    width:38px;height:4px;border-radius:2px;background:#dfe3e8;
    margin:9px auto 0;flex-shrink:0;
  }

  /* 类型切换 */
  .seg{
    display:flex;gap:4px;background:#f1f3f6;border-radius:12px;
    padding:4px;margin:14px 18px 0;flex-shrink:0;
  }
  .seg button{
    flex:1;padding:9px 0;border-radius:9px;font-size:14px;font-weight:600;
    color:var(--text-2);transition:.16s;
  }
  .seg button.on{background:#fff;box-shadow:0 1px 3px rgba(16,24,40,.1);}
  .seg button.on[data-t="expense"]{color:var(--expense);}
  .seg button.on[data-t="income"]{color:var(--income);}

  /* 金额 */
  .amount-box{
    padding:16px 18px 12px;border-bottom:1px solid var(--line);flex-shrink:0;
  }
  .amount-box .cap{font-size:12px;color:var(--text-3);margin-bottom:6px;}
  .amount-line{display:flex;align-items:baseline;gap:4px;}
  .amount-line .cur{font-size:22px;font-weight:600;color:var(--text-2);}
  .amount-line .val{
    font-size:38px;font-weight:700;letter-spacing:-1px;
    font-variant-numeric:tabular-nums;line-height:1.1;
    flex:1;min-width:0;overflow:hidden;white-space:nowrap;
  }
  .amount-line .val.placeholder{color:#c8ced6;letter-spacing:0;font-size:32px;}
  .amount-line .val.expense{color:var(--expense);}
  .amount-line .val.income{color:var(--income);}

  /* 分类 */
  .cats{
    display:grid;grid-template-columns:repeat(4,1fr);gap:6px;
    padding:14px 14px 4px;overflow-y:auto;flex-shrink:0;
  }
  .cat{
    border-radius:13px;padding:10px 2px 8px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:.14s;border:1.5px solid transparent;
  }
  .cat .ci{font-size:21px;line-height:1;}
  .cat .cn{font-size:11.5px;color:var(--text-2);}
  .cat:active{background:#f4f6f8;}
  .cat.on{background:#eef4ff;border-color:#c7dbff;}
  .cat.on .cn{color:var(--brand);font-weight:600;}

  /* 备注 + 日期 */
  .meta{
    display:flex;gap:8px;padding:12px 18px;flex-shrink:0;
  }
  .meta .note{
    flex:1;background:#f4f6f8;border-radius:11px;
    padding:11px 13px;font-size:14px;border:1.5px solid transparent;
    outline:none;min-width:0;color:var(--text);
  }
  .meta .note:focus{background:#fff;border-color:#c7dbff;}
  .meta .note::placeholder{color:#aab2bc;}
  .meta .date{
    background:#f4f6f8;border-radius:11px;padding:11px 12px;font-size:13.5px;
    color:var(--text-2);position:relative;overflow:hidden;flex-shrink:0;
    display:flex;align-items:center;gap:5px;
  }
  .meta .date input{
    position:absolute;inset:0;opacity:0;width:100%;height:100%;
    border:none;background:none;
  }

  /* 键盘 */
  .keys{
    display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
    background:var(--line);border-top:1px solid var(--line);
    flex-shrink:0;
  }
  .keys button{
    background:#fbfcfd;padding:15px 0;font-size:21px;font-weight:500;
    color:var(--text);font-variant-numeric:tabular-nums;
  }
  .keys button:active{background:#eef1f5;}
  .keys .save{
    grid-row:span 2;background:var(--brand);color:#fff;
    font-size:16px;font-weight:600;display:grid;place-items:center;
  }
  .keys .save:active{background:#2560d4;}
  .keys .save:disabled{background:#c3cbd6;}
  .keys .del{font-size:19px;color:var(--text-2);}

  /* 菜单弹层 */
  .menu-list{padding:10px 14px calc(20px + var(--safe-b));}
  .menu-list .mi{
    display:flex;align-items:center;gap:13px;
    width:100%;text-align:left;
    padding:15px 12px;border-radius:13px;
    font-size:15px;font-weight:500;color:var(--text);
  }
  .menu-list .mi:active{background:#f4f6f8;}
  .menu-list .mi .mi-ico{font-size:19px;width:24px;text-align:center;flex-shrink:0;}
  .menu-list .mi .mi-sub{font-size:12px;color:var(--text-3);margin-top:2px;font-weight:400;}
  .menu-list .mi.danger{color:var(--expense);}
  .menu-list .sep{height:1px;background:var(--line);margin:6px 12px;}

  /* 模板菜单 */
  .tmpl-wrap{padding:6px 16px calc(22px + var(--safe-b));overflow-y:auto;}
  .tmpl-title{font-size:17px;font-weight:700;margin:12px 0 2px;}
  .tmpl-sub{font-size:12.5px;color:var(--text-3);margin-bottom:14px;}
  .tmpl-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:9px;
  }
  .tmpl-card{
    position:relative;
    background:#f7f8fa;border-radius:14px;
    padding:13px 12px 11px;
    text-align:left;
    border:1.5px solid transparent;
    transition:.13s;
  }
  .tmpl-card:active{background:#eef4ff;border-color:#c7dbff;}
  .tmpl-card .tn{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:6px;}
  .tmpl-card .tn .te{font-size:16px;}
  .tmpl-card .ta{
    font-size:18px;font-weight:700;margin-top:5px;color:var(--expense);
    font-variant-numeric:tabular-nums;letter-spacing:-.3px;
  }
  .tmpl-card .ta.income{color:var(--income);}
  .tmpl-card .tc{font-size:11.5px;color:var(--text-3);margin-top:3px;}
  .tmpl-card .edit-badge{
    position:absolute;top:8px;right:8px;
    width:26px;height:26px;border-radius:8px;
    display:grid;place-items:center;
    font-size:13px;color:var(--text-3);background:#fff;
    box-shadow:0 1px 3px rgba(16,24,40,.1);
  }
  .tmpl-card.empty-slot{
    border:1.5px dashed #d5dae1;background:transparent;
    display:flex;align-items:center;justify-content:center;gap:6px;
    color:var(--text-3);font-size:13px;min-height:74px;
  }

  /* 模板编辑 */
  .tpl-edit{padding:6px 18px calc(24px + var(--safe-b));}
  .tpl-edit .row{
    display:flex;gap:8px;margin-bottom:10px;
  }
  .tpl-edit .fld{
    flex:1;background:#f4f6f8;border-radius:11px;
    padding:12px 13px;font-size:14.5px;border:1.5px solid transparent;
    outline:none;min-width:0;color:var(--text);
  }
  .tpl-edit .fld:focus{background:#fff;border-color:#c7dbff;}
  .tpl-edit .fld::placeholder{color:#aab2bc;}
  .tpl-edit .fld.amt{flex:1;font-variant-numeric:tabular-nums;font-weight:600;}
  .tpl-edit .cats-mini{
    display:flex;flex-wrap:wrap;gap:7px;margin:2px 0 14px;
  }
  .tpl-edit .cm{
    padding:7px 11px;border-radius:999px;background:#f4f6f8;
    font-size:12.5px;color:var(--text-2);border:1.5px solid transparent;
  }
  .tpl-edit .cm.on{background:#eef4ff;border-color:#c7dbff;color:var(--brand);font-weight:600;}
  .tpl-edit .acts{display:flex;gap:9px;margin-top:6px;}
  .tpl-edit .acts button{
    flex:1;padding:13px;border-radius:13px;font-size:15px;font-weight:600;
  }
  .tpl-edit .acts .save{background:var(--brand);color:#fff;}
  .tpl-edit .acts .save:active{background:#2560d4;}
  .tpl-edit .acts .del{background:#fef2f2;color:var(--expense);flex:0 0 34%;}
  .tpl-edit .seg{margin:12px 0 12px;}

  /* 详情弹层 */
  .detail{padding:18px 20px calc(20px + var(--safe-b));}
  .detail h3{margin:12px 0 18px;font-size:17px;}
  .detail .row{
    display:flex;justify-content:space-between;padding:12px 0;
    border-bottom:1px solid var(--line);font-size:14px;
  }
  .detail .row .k{color:var(--text-3);}
  .detail .row .v{font-weight:500;text-align:right;max-width:60%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .detail .acts{display:flex;gap:10px;margin-top:22px;}
  .detail .acts button{
    flex:1;padding:13px;border-radius:12px;font-size:15px;font-weight:600;
  }
  .detail .acts .del{background:#fef2f2;color:var(--expense);}
  .detail .acts .close{background:#f1f3f6;color:var(--text-2);}

  .toast{
    position:fixed;left:50%;bottom:calc(110px + var(--safe-b));
    transform:translateX(-50%) translateY(8px);
    background:rgba(27,31,36,.92);color:#fff;
    padding:10px 18px;border-radius:11px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:.22s;z-index:90;white-space:nowrap;
    max-width:88vw;overflow:hidden;text-overflow:ellipsis;
  }
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <div class="month-nav">
      <button id="prevM" aria-label="上个月">‹</button>
      <div class="label" id="monthLabel">—</div>
      <button id="nextM" aria-label="下个月">›</button>
    </div>
    <div class="right">
      <button class="icon-btn" id="menuBtn" aria-label="更多">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="5" r="1.4" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/>
          <circle cx="12" cy="19" r="1.4" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- 记一笔（常驻，打开即是） -->
  <section class="entry" id="entryCard">
    <div class="seg" id="typeSeg">
      <button data-t="expense" class="on">支出</button>
      <button data-t="income">收入</button>
    </div>

    <div class="amount-box">
      <div class="cap">
        <span>金额</span>
        <button class="cat-hint" id="catHint" type="button">记入 <b id="catHintN">🍚 餐饮</b> ▾</button>
      </div>
      <div class="amount-line">
        <span class="cur">¥</span>
        <span class="val placeholder expense" id="amountVal">0.00</span>
      </div>
    </div>

    <div class="meta">
      <input class="note" id="noteInput" placeholder="备注（可空）" maxlength="40">
      <label class="date">
        <span>📅</span><span id="dateLabel">今天</span>
        <input type="date" id="dateInput">
      </label>
    </div>

    <div class="keys">
      <button data-k="1">1</button>
      <button data-k="2">2</button>
      <button data-k="3">3</button>
      <button class="del" data-k="del">⌫</button>
      <button data-k="4">4</button>
      <button data-k="5">5</button>
      <button data-k="6">6</button>
      <button class="save" id="saveBtn" disabled>保存</button>
      <button data-k="7">7</button>
      <button data-k="8">8</button>
      <button data-k="9">9</button>
      <button data-k=".">.</button>
      <button data-k="0">0</button>
      <button data-k="00">00</button>
    </div>
  </section>

  <section class="summary">
    <div class="cap">本月支出</div>
    <div class="big" id="sumExpense">¥0.00</div>
    <div class="split">
      <div>
        <div class="k">本月收入</div>
        <div class="v income" id="sumIncome">¥0.00</div>
      </div>
      <div>
        <div class="k">本月结余</div>

      </div>
    </div>
  </section>

  <div class="cat-head" id="catHead">
    <span>选择分类</span>

  </div>

<!-- 模板编辑 -->
<div class="sheet" id="tplEditSheet">
  <div class="sheet-grip"></div>
  <div class="tpl-edit">
    <div class="seg" id="tplSeg">
      <button data-t="expense" class="on">支出</button>

    <div class="row">
      <input class="fld" id="tplName" placeholder="模板名称，如：早餐" maxlength="10">

<div class="sheet" id="detailSheet">
  <div class="sheet-grip"></div>
  <div class="detail">
    <h3>这笔记录</h3>
    <div class="row"><span class="k">金额</span><span class="v" id="dAmount">—</span></div>
    <div class="row"><span class="k">类型</span><span class="v" id="dType">—</span></div>
    <div class="row"><span class="k">分类</span><span class="v" id="dCat">—</span></div>
    <div class="row"><span class="k">备注</span><span class="v" id="dNote">—</span></div>

      <button class="close" id="closeDetail">关闭</button>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var STORE_KEY = 'moneybook.records.v1';
  var TPL_KEY = 'moneybook.templates.v1';
  var PAGE_SIZE = 10;

  /* 分类表：t = 该分类适用的收支类型（expense 支出 / income 收入 / both 两者通用）
     顺序即快捷栏按钮顺序，最后一个「快捷」是动作按钮，不是分类。 */
  var CATS = [
    {k:'food',      n:'餐饮', e:'🍚', t:'expense'},
    {k:'grocery',   n:'买菜', e:'🥬', t:'expense'},
    {k:'snack',     n:'零食', e:'🍪', t:'expense'},
    {k:'goods',     n:'百货', e:'🛍️', t:'expense'},
    {k:'medical',   n:'医疗', e:'💊', t:'expense'},
    {k:'bus',       n:'大巴', e:'🚌', t:'expense'},
    {k:'train',     n:'火车', e:'🚄', t:'expense'},
    {k:'fuel',      n:'汽油', e:'⛽', t:'expense'},
    {k:'toll',      n:'路桥', e:'🛣️', t:'expense'},
    {k:'taxi',      n:'打车', e:'🚕', t:'expense'},
    {k:'utility',   n:'水电', e:'💡', t:'expense'},
    {k:'gas',       n:'燃气', e:'🔥', t:'expense'},
    {k:'property',  n:'物业', e:'🏢', t:'expense'},
    {k:'heating',   n:'取暖', e:'♨️', t:'expense'},
    {k:'rent',      n:'房租', e:'🏠', t:'expense'},
    {k:'insurance', n:'保险', e:'🛡️', t:'expense'},
    {k:'give',      n:'给于', e:'🤝', t:'both'},
    {k:'salary',    n:'工资', e:'💰', t:'income'},
    {k:'other',     n:'其他', e:'📦', t:'both'}
  ];

  var DEFAULT_CAT = 'food';

  /* 旧版本分类键 → 新分类键（保证老数据照常显示） */
  var LEGACY_CAT = {
    traffic:'bus', shopping:'goods', home:'property', fun:'taxi',
    study:'other', bonus:'salary', redpack:'give', parttime:'salary', invest:'salary'
  };

  var DEFAULT_TPLS = [
    {name:'早餐', amount:8,   type:'expense', cat:'food',    note:''},
    {name:'午餐', amount:25,  type:'expense', cat:'food',    note:''},
    {name:'晚餐', amount:30,  type:'expense', cat:'food',    note:''},
    {name:'买菜', amount:50,  type:'expense', cat:'grocery', note:''},
    {name:'打车', amount:30,  type:'expense', cat:'taxi',    note:''},
    {name:'加油', amount:300, type:'expense', cat:'fuel',    note:''},
    null,
    null
  ];

  var state = {
    records: [],
    templates: [],
    viewMonth: startOfMonth(new Date()),
    draft: null,
    detailId: null,
    expanded: false,
    editingTpl: -1,
    tplDraft: null
  };

  /* ---------- 工具 ---------- */
  function startOfMonth(d){ return new Date(d.getFullYear(), d.getMonth(), 1); }
  function pad(n){ return n<10 ? '0'+n : ''+n; }
  function ymd(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function fmtMoney(v){
    var neg = v < 0;
    v = Math.abs(v);
    var s = v.toFixed(2);
    var p = s.split('.');
    p[0] = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg?'-':'') + p[0] + '.' + p[1];
  }
  function fmtDateHuman(key){
    var t = ymd(new Date());
    var y = new Date(); y.setDate(y.getDate()-1);
    if (key === t) return '今天';
    if (key === ymd(y)) return '昨天';
    var p = key.split('-');
    return parseInt(p[1],10) + '月' + parseInt(p[2],10) + '日';
  }
  function fmtWeekday(key){
    var p = key.split('-');
    var d = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10));
    return '周' + '日一二三四五六'.charAt(d.getDay());
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function catsFor(type){
    var own = CATS.filter(function(c){ return c.t === type; });
    var both = CATS.filter(function(c){ return c.t === 'both'; });
    return own.concat(both);
  }
  function defaultCatFor(type){
    if(type === 'income' && findCat('income','salary')) return 'salary';
    if(type === 'expense' && findCat('expense','food')) return 'food';
    var list = catsFor(type);
    return list.length ? list[0].k : DEFAULT_CAT;
  }
  function findCat(type, k){
    if(LEGACY_CAT[k]) k = LEGACY_CAT[k];
    for(var i=0;i<CATS.length;i++){
      if(CATS[i].k === k && (CATS[i].t === type || CATS[i].t === 'both')) return CATS[i];
    }
    // 类型不匹配时，只要能找到这个分类就返回（老数据兼容）
    for(var j=0;j<CATS.length;j++) if(CATS[j].k === k) return CATS[j];
    return null;
  }
  function catName(type, k){
    var c = findCat(type, k);
    return c ? c.n : '未分类';
  }

  /* ---------- 存储 ---------- */
  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      state.records = raw ? JSON.parse(raw) : [];
      if(!Array.isArray(state.records)) state.records = [];
    }catch(e){ state.records = []; }
    try{
      var traw = localStorage.getItem(TPL_KEY);
      state.templates = traw ? JSON.parse(traw) : null;
      if(!Array.isArray(state.templates)) state.templates = DEFAULT_TPLS.slice();
      while(state.templates.length < 8) state.templates.push(null);
    }catch(e){ state.templates = DEFAULT_TPLS.slice(); }
  }
  function save(){
    try{ localStorage.setItem(STORE_KEY, JSON.stringify(state.records)); }
    catch(e){ toast('保存失败：存储空间不足'); }
  }
  function saveTemplates(){
    try{ localStorage.setItem(TPL_KEY, JSON.stringify(state.templates)); }
    catch(e){ toast('模板保存失败'); }
  }

  /* ---------- 渲染 ---------- */
  function render(){
    var y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
    document.getElementById('monthLabel').textContent = y + '年' + (m+1) + '月';

    var inMonth = state.records.filter(function(r){
      var p = r.date.split('-');
      return parseInt(p[0],10)===y && parseInt(p[1],10)-1===m;
    });
    inMonth.sort(function(a,b){
      return a.date === b.date ? b.ts - a.ts : (a.date < b.date ? 1 : -1);
    });

    var exp=0, inc=0;
    inMonth.forEach(function(r){ if(r.type==='expense') exp+=r.amount; else inc+=r.amount; });

    document.getElementById('sumExpense').textContent = '¥' + fmtMoney(exp);
    document.getElementById('sumIncome').textContent  = '¥' + fmtMoney(inc);
    var bal = inc - exp;
    var balEl = document.getElementById('sumBalance');
    balEl.textContent = '¥' + fmtMoney(bal);
    balEl.className = 'v ' + (bal>0?'income':(bal<0?'expense':'neutral'));

    document.getElementById('recCount').textContent = inMonth.length ? ' · ' + inMonth.length + ' 笔' : '';

    var wrap = document.getElementById('groups');
    if(!inMonth.length){
      wrap.innerHTML = '<div class="empty"><div class="e">🧾</div><div class="m">' +
        (state.records.length ? '这个月还没有记录<br>换个月看看？' : '还没有任何记录<br>在上方输入金额就能记第一笔') +
        '</div></div>';
      return;
    }

    // 分组（保持排序后的顺序）
    var byDate = [];
    var dateIndex = {};
    inMonth.forEach(function(r){
      if(dateIndex[r.date] === undefined){
        dateIndex[r.date] = byDate.length;
        byDate.push({date:r.date, list:[]});
      }
      byDate[dateIndex[r.date]].list.push(r);
    });

    // 折叠：最多 PAGE_SIZE 条
    var limit = state.expanded ? Infinity : PAGE_SIZE;
    var shown = 0, hidden = 0;
    var html = '';
    for(var i=0; i<byDate.length; i++){
      var g = byDate[i];
      var remain = limit - shown;
      var showList = remain <= 0 ? [] : g.list.slice(0, remain);
      if(!showList.length){ hidden += g.list.length; continue; }
      shown += showList.length;
      hidden += g.list.length - showList.length;

      var dayExp=0, dayInc=0;
      showList.forEach(function(r){ if(r.type==='expense') dayExp+=r.amount; else dayInc+=r.amount; });
      var sumTxt = (dayExp?'支出 ¥'+fmtMoney(dayExp):'') +
                   (dayExp&&dayInc?' · ':'') +
                   (dayInc?'收入 ¥'+fmtMoney(dayInc):'');
      html += '<div class="group"><div class="group-head"><span class="d">' +
        fmtDateHuman(g.date) + ' ' + fmtWeekday(g.date) + '</span><span class="s">' + sumTxt + '</span></div><div class="items">';
      showList.forEach(function(r){
        var cat = findCat(r.type, r.cat);
        html += '<div class="item" data-id="' + r.id + '">' +
          '<div class="ico">' + (cat?cat.e:'📦') + '</div>' +
          '<div class="mid"><div class="c">' + esc(catName(r.type, r.cat)) + '</div>' +
          (r.note ? '<div class="n">' + esc(r.note) + '</div>' : '') +
          '</div>' +
          '<div class="amt ' + r.type + '">' + (r.type==='expense'?'-':'+') + '¥' + fmtMoney(r.amount) + '</div>' +
          '</div>';
      });
      html += '</div></div>';
    }
    if(hidden > 0){
      html += '<button class="more-btn" id="moreBtn">展开其余 ' + hidden + ' 条 ▾</button>';
    }
    wrap.innerHTML = html;
  }

  /* ---------- 快捷分类栏 ---------- */
  function renderQuickbar(){
    var html = '';
    CATS.forEach(function(c){
      var type = c.t === 'income' ? 'income' : 'expense';
      html += '<button class="qbtn' + (c.t === 'income' ? ' qinc' : '') +
        '" data-cat="' + c.k + '" data-t="' + type + '" title="' + c.n + '（点一下直接记一笔）">' +
        '<span class="qe">' + c.e + '</span><span class="qn">' + c.n + '</span></button>';
    });
    // 「快捷」动作按钮：弹出一键记账模板菜单
    html += '<button class="qbtn qmain" data-act="quick" title="一键记账模板">' +
      '<span class="qe">⚡</span><span class="qn">快捷</span></button>';
    document.getElementById('quickbar').innerHTML = html;
  }

  /* ---------- 模板 ---------- */
  function renderTmplGrid(){
    var html = '';
    for(var i=0;i<8;i++){
      var t = state.templates[i];
      if(t){
        var cat = findCat(t.type, t.cat);
        html += '<button class="tmpl-card" data-i="' + i + '">' +
          '<span class="edit-badge" data-edit="' + i + '">✎</span>' +
          '<div class="tn"><span class="te">' + (cat?cat.e:'📦') + '</span>' + esc(t.name || (cat?cat.n:'未命名')) + '</div>' +
          '<div class="ta ' + t.type + '">' + (t.type==='expense'?'-':'+') + '¥' + fmtMoney(t.amount) + '</div>' +
          '<div class="tc">' + (cat?cat.n:'') + (t.note ? ' · ' + esc(t.note) : '') + '</div>' +
          '</button>';
      }else{
        html += '<button class="tmpl-card empty-slot" data-i="' + i + '">＋ 设置模板</button>';
      }
    }
    document.getElementById('tmplGrid').innerHTML = html;
  }

  function recordFromTemplate(t){
    if(!t || !(t.amount > 0)) return;
    state.records.push({
      id: uid(),
      type: t.type,
      cat: t.cat,
      amount: Math.round(t.amount*100)/100,
      note: t.note || '',
      date: ymd(new Date()),
      ts: Date.now()
    });
    save();
    state.viewMonth = startOfMonth(new Date());
    state.expanded = false;
    render();
    var cat = findCat(t.type, t.cat);
    toast('已记：' + (cat?cat.n:'') + ' ' + (t.name?t.name+' ':'') + '¥' + fmtMoney(t.amount));
  }

  function openTplEdit(i){
    state.editingTpl = i;
    var t = state.templates[i];
    state.tplDraft = t ? {
      type: t.type, cat: t.cat,
      name: t.name || '', amount: String(t.amount), note: t.note || ''
    } : { type:'expense', cat:DEFAULT_CAT, name:'', amount:'', note:'' };
    syncTplEdit();
    openSheet('tplEditSheet');
  }

  function syncTplEdit(){
    var d = state.tplDraft;
    Array.prototype.forEach.call(document.querySelectorAll('#tplSeg button'), function(b){
      b.classList.toggle('on', b.dataset.t === d.type);
    });
    document.getElementById('tplName').value = d.name;
    document.getElementById('tplAmount').value = d.amount;
    document.getElementById('tplNote').value = d.note;
    var catsHtml = catsFor(d.type).map(function(c){
      return '<button class="cm' + (c.k===d.cat?' on':'') + '" data-k="' + c.k + '">' + c.e + ' ' + c.n + '</button>';
    }).join('');
    document.getElementById('tplCats').innerHTML = catsHtml;
  }

  function saveTpl(){
    var i = state.editingTpl;
    var d = state.tplDraft;
    var amt = parseFloat(d.amount);
    if(!amt || amt <= 0){ toast('请填写金额'); return; }
    var cat = findCat(d.type, d.cat);
    state.templates[i] = {
      name: d.name.trim() || (cat?cat.n:'未命名'),
      amount: Math.round(amt*100)/100,
      type: d.type,
      cat: d.cat,
      note: d.note.trim()
    };
    saveTemplates();
    closeSheet('tplEditSheet');
    renderTmplGrid();
    toast('模板已保存');
  }

  function clearTpl(){
    var i = state.editingTpl;
    state.templates[i] = null;
    saveTemplates();
    closeSheet('tplEditSheet');
    renderTmplGrid();
    toast('已清除该模板位');
  }

  /* ---------- 记一笔（常驻卡片，打开即可输入） ---------- */
  function resetDraft(){
    var d = state.draft;
    state.draft = {
      type: (d && d.type) || 'expense',
      cat: (d && d.cat) || defaultCatFor('expense'),
      amountStr: '',
      date: ymd(new Date())
    };
    var ni = document.getElementById('noteInput');
    if(ni) ni.value = '';
    var di = document.getElementById('dateInput');
    if(di) di.value = state.draft.date;
  }

  function renderEntry(){
    var d = state.draft;
    if(!d) return;
    Array.prototype.forEach.call(document.querySelectorAll('#typeSeg button'), function(b){
      b.classList.toggle('on', b.dataset.t === d.type);
    });
    var av = document.getElementById('amountVal');
    var has = d.amountStr !== '' && parseFloat(d.amountStr) > 0;
    av.textContent = has ? fmtMoney(parseFloat(d.amountStr)) : '0.00';
    av.className = 'val ' + (has ? d.type : 'placeholder ' + d.type);
    document.getElementById('dateLabel').textContent = fmtDateHuman(d.date);
    document.getElementById('saveBtn').disabled = !has;

    var c = findCat(d.type, d.cat);
    var label = c ? (c.e + ' ' + c.n) : '未分类';
    document.getElementById('catHintN').textContent = label;
    document.getElementById('catNow').textContent = '当前：' + (c ? c.n : '未分类');

    // 分类网格选中态
    Array.prototype.forEach.call(
      document.querySelectorAll('#quickbar .qbtn[data-cat]'),
      function(b){ b.classList.toggle('on', b.dataset.cat === d.cat); }
    );
  }

  function keyPress(k){
    var d = state.draft; if(!d) return;
    var s = d.amountStr;
    if(k === 'del'){ s = s.slice(0,-1); }
    else if(k === '.'){
      if(s.indexOf('.') >= 0) return;
      s = (s === '' ? '0' : s) + '.';
    }
    else if(k === '00'){
      if(s === '' || s === '0') return;
      if(s.indexOf('.') >= 0 && s.split('.')[1].length >= 2) return;
      s = s + '00';
    }
    else {
      if(s.indexOf('.') >= 0 && s.split('.')[1].length >= 2) return;
      if(s.replace('.','').length >= 9) return;
      s = (s === '0' ? k : s + k);
    }
    d.amountStr = s;
    renderEntry();
  }

  function commit(){
    var d = state.draft;
    var amt = parseFloat(d.amountStr);
    if(!amt || amt <= 0){ toast('请输入金额'); return; }
    var dateStr = document.getElementById('dateInput').value || d.date;
    state.records.push({
      id: uid(),
      type: d.type,
      cat: d.cat,
      amount: Math.round(amt*100)/100,
      note: document.getElementById('noteInput').value.trim(),
      date: dateStr,
      ts: Date.now()
    });
    save();
    var p = dateStr.split('-');
    state.viewMonth = new Date(parseInt(p[0],10), parseInt(p[1],10)-1, 1);
    state.expanded = false;

    // 保留分类与日期，清空金额和备注，方便接着记下一笔
    var cat = findCat(d.type, d.cat);
    d.amountStr = '';
    document.getElementById('noteInput').value = '';
    render();
    renderEntry();
    if(window.scrollTo) window.scrollTo({ top:0, behavior:'smooth' });
    toast('已记下 ' + (cat ? cat.e + ' ' + cat.n + ' ' : '') + '¥' + fmtMoney(amt));
  }

  /* ---------- 详情 ---------- */
  function openDetail(id){
    var r = null;
    for(var i=0;i<state.records.length;i++) if(state.records[i].id===id) r = state.records[i];
    if(!r) return;
    state.detailId = id;
    var cat = findCat(r.type, r.cat);
    document.getElementById('dAmount').textContent = (r.type==='expense'?'-':'+') + '¥' + fmtMoney(r.amount);
    document.getElementById('dType').textContent = r.type==='expense' ? '支出' : '收入';
    document.getElementById('dCat').textContent = (cat?cat.e+' ':'') + (cat?cat.n:r.cat);
    document.getElementById('dNote').textContent = r.note || '—';
    document.getElementById('dDate').textContent = r.date + ' ' + fmtWeekday(r.date);
    openSheet('detailSheet');
  }

  function removeDetail(){
    var id = state.detailId;
    state.records = state.records.filter(function(r){ return r.id !== id; });
    save(); closeSheet('detailSheet'); render(); toast('已删除');
  }

  /* ---------- 弹层控制 ---------- */
  function openSheet(id){
    document.getElementById('mask').classList.add('on');
    document.getElementById(id).classList.add('on');
  }
  function closeSheet(id){
    document.getElementById(id).classList.remove('on');
    if(!document.querySelector('.sheet.on')) document.getElementById('mask').classList.remove('on');
  }
  function closeAll(){
    ['menuSheet','tmplSheet','tplEditSheet','detailSheet'].forEach(closeSheet);
  }

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function toast(msg){
    var el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.classList.remove('on'); }, 1900);
  }

  /* ---------- 导出 ---------- */
  function monthScope(){
    var y = state.viewMonth.getFullYear(), m = state.viewMonth.getMonth();
    return state.records.filter(function(r){
      var p = r.date.split('-');
      return parseInt(p[0],10)===y && parseInt(p[1],10)-1===m;
    }).sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : a.ts-b.ts); });
  }
  function monthTag(){
    return state.viewMonth.getFullYear() + pad(state.viewMonth.getMonth()+1);
  }
  function yearScope(){
    var y = state.viewMonth.getFullYear();
    return state.records.filter(function(r){
      return parseInt(r.date.split('-')[0],10) === y;
    }).sort(function(a,b){ return a.date < b.date ? -1 : (a.date > b.date ? 1 : a.ts-b.ts); });
  }
  function yearTag(){
    return state.viewMonth.getFullYear() + '年';
  }
  function downloadBlob(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }

  function buildCsvText(scope){
    var lines = ['日期,星期,类型,分类,备注,金额'];
    scope.forEach(function(r){
      var cat = findCat(r.type, r.cat);
      lines.push([
        r.date,
        fmtWeekday(r.date),
        r.type==='expense' ? '支出' : '收入',
        (cat?cat.n:r.cat),
        '"' + String(r.note||'').replace(/"/g,'""') + '"',
        (r.type==='expense' ? '-' : '') + r.amount.toFixed(2)
      ].join(','));
    });
    var exp=0, inc=0;
    scope.forEach(function(r){ if(r.type==='expense') exp+=r.amount; else inc+=r.amount; });
    lines.push('');
    lines.push('合计,,,,收入 ' + inc.toFixed(2) + ',支出 ' + exp.toFixed(2));
    lines.push('结余,,,,,' + (inc-exp).toFixed(2));
    return lines.join('\r\n');
  }

  function exportCSV(){
    var scope = yearScope();
    if(!scope.length){ toast('今年没有记录'); return; }
    var csv = '\ufeff' + buildCsvText(scope);
    downloadBlob(new Blob([csv], {type:'text/csv;charset=utf-8'}), '记账本_' + yearTag() + '.csv');
    toast('已导出 ' + yearTag() + ' 共 ' + scope.length + ' 条记录');
  }

  /* ---- 纯 JS 生成 xlsx（zip stored，无外部依赖） ---- */
  var CRC_TABLE = (function(){
    var t = new Uint32Array(256);
    for(var n=0;n<256;n++){
      var c = n;
      for(var k=0;k<8;k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8){
    var c = 0xFFFFFFFF;
    for(var i=0;i<u8.length;i++) c = CRC_TABLE[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  function str2u8(s){ return new TextEncoder().encode(s); }
  function colRef(j){
    var s='', n=j+1;
    while(n>0){ var r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=Math.floor((n-1)/26); }
    return s;
  }
  function escXml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c];
    });
  }
  function makeZip(fileEntries){
    var parts=[], central=[], offset=0;
    fileEntries.forEach(function(f){
      var nameU8 = str2u8(f.name), data = f.data;
      var crc = crc32(data);
      var lh = new DataView(new ArrayBuffer(30));
      lh.setUint32(0, 0x04034b50, true);
      lh.setUint16(4, 20, true);
      lh.setUint16(6, 0x0800, true);   // UTF-8 文件名
      lh.setUint32(14, crc, true);
      lh.setUint32(18, data.length, true);
      lh.setUint32(22, data.length, true);
      lh.setUint16(26, nameU8.length, true);
      parts.push(new Uint8Array(lh.buffer), nameU8, data);
      central.push({nameU8:nameU8, crc:crc, size:data.length, offset:offset});
      offset += 30 + nameU8.length + data.length;
    });
    var cdStart = offset, cdSize = 0, cdParts = [];
    central.forEach(function(e){
      var ch = new DataView(new ArrayBuffer(46));
      ch.setUint32(0, 0x02014b50, true);
      ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
      ch.setUint16(8, 0x0800, true);
      ch.setUint32(16, e.crc, true);
      ch.setUint32(20, e.size, true); ch.setUint32(24, e.size, true);
      ch.setUint16(28, e.nameU8.length, true);
      ch.setUint32(42, e.offset, true);
      cdParts.push(new Uint8Array(ch.buffer), e.nameU8);
      cdSize += 46 + e.nameU8.length;
    });
    var eocd = new DataView(new ArrayBuffer(22));
    eocd.setUint32(0, 0x06054b50, true);
    eocd.setUint16(8, central.length, true);
    eocd.setUint16(10, central.length, true);
    eocd.setUint32(12, cdSize, true);
    eocd.setUint32(16, cdStart, true);
    return new Blob(parts.concat(cdParts, [new Uint8Array(eocd.buffer)]),
      {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  }
  function makeSheetXml(rows){
    return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>' +
      rows.map(function(row, i){
        return '<row r="' + (i+1) + '">' + row.map(function(c, j){
          var ref = colRef(j) + (i+1);
          if(typeof c === 'number' && isFinite(c)) return '<c r="' + ref + '"><v>' + c + '</v></c>';
          return '<c r="' + ref + '" t="inlineStr"><is><t xml:space="preserve">' + escXml(c) + '</t></is></c>';
        }).join('') + '</row>';
      }).join('') + '</sheetData></worksheet>';
  }
  function exportXLSX(){
    var scope = yearScope();
    if(!scope.length){ toast('今年没有记录'); return; }
    var rows = [['日期','星期','类型','分类','备注','金额']];
    var exp=0, inc=0;
    scope.forEach(function(r){
      var cat = findCat(r.type, r.cat);
      rows.push([r.date, fmtWeekday(r.date), r.type==='expense'?'支出':'收入',
        cat?cat.n:String(r.cat), r.note||'',
        r.type==='expense' ? -r.amount : r.amount]);
      if(r.type==='expense') exp+=r.amount; else inc+=r.amount;
    });
    rows.push([]);
    rows.push(['合计','','','','收入', Math.round(inc*100)/100]);
    rows.push(['合计','','','','支出', Math.round(exp*100)/100]);
    rows.push(['结余','','','','', Math.round((inc-exp)*100)/100]);
    var CT = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
      '<Default Extension="xml" ContentType="application/xml"/>' +
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>' +
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>' +
      '</Types>';
    var RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>' +
      '</Relationships>';
    var WB = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">' +
      '<sheets><sheet name="流水" sheetId="1" r:id="rId1"/></sheets></workbook>';
    var WBRELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>' +
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>' +
      '</Relationships>';
    var blob = makeZip([
      {name:'[Content_Types].xml', data:str2u8(CT)},
      {name:'_rels/.rels', data:str2u8(RELS)},
      {name:'xl/workbook.xml', data:str2u8(WB)},
      {name:'xl/_rels/workbook.xml.rels', data:str2u8(WBRELS)},
      {name:'xl/worksheets/sheet1.xml', data:str2u8(makeSheetXml(rows))}
    ]);
    downloadBlob(blob, '记账本_' + yearTag() + '.xlsx');
    toast('已导出 ' + yearTag() + ' Excel（' + scope.length + ' 条）');
  }

  /* ---------- 备份 / 恢复 / 清空 ---------- */
  function backupJSON(){
    var blob = new Blob([JSON.stringify(state.records, null, 2)], {type:'application/json'});
    downloadBlob(blob, '记账本备份_' + ymd(new Date()) + '.json');
    toast('备份文件已下载');
  }

  function restoreJSON(){
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function(){
      var f = inp.files && inp.files[0];
      if(!f) return;
      var fr = new FileReader();
      fr.onload = function(){
        try{
          var arr = JSON.parse(fr.result);
          if(!Array.isArray(arr)) throw new Error('格式不对');
          var ok = arr.filter(function(r){
            return r && r.date && typeof r.amount === 'number' && (r.type==='expense'||r.type==='income');
          }).map(function(r){
            return { id:r.id||uid(), type:r.type, cat:r.cat||'other',
                     amount:r.amount, note:r.note||'', date:r.date, ts:r.ts||Date.now() };
          });
          if(!ok.length) throw new Error('没有可用记录');
          if(window.confirm('将导入 ' + ok.length + ' 条记录，替换当前全部数据。继续？')){
            state.records = ok; save(); render(); toast('已恢复 ' + ok.length + ' 条');
          }
        }catch(e){ toast('恢复失败：文件格式不正确'); }
      };
      fr.readAsText(f);
    };
    inp.click();
  }

  function clearAll(){
    if(window.confirm('确定要清空全部 ' + state.records.length + ' 条记录吗？此操作不可撤销。')){
      state.records = []; save(); render(); toast('已清空');
    }
  }

  /* ---------- 事件绑定 ---------- */
  function bind(){
    document.getElementById('catHint').addEventListener('click', function(){
      var h = document.getElementById('catHead');
      if(h && h.scrollIntoView) h.scrollIntoView({ behavior:'smooth', block:'start' });
    });
    document.getElementById('menuBtn').addEventListener('click', function(){ openSheet('menuSheet'); });
    document.getElementById('mask').addEventListener('click', closeAll);
    document.getElementById('saveBtn').addEventListener('click', commit);
    document.getElementById('closeDetail').addEventListener('click', function(){ closeSheet('detailSheet'); });
    document.getElementById('delBtn').addEventListener('click', function(){
      if(window.confirm('删除这笔记录？')) removeDetail();
    });

    document.getElementById('prevM').addEventListener('click', function(){
      state.viewMonth = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth()-1, 1);
      state.expanded = false;
      render();
    });
    document.getElementById('nextM').addEventListener('click', function(){
      state.viewMonth = new Date(state.viewMonth.getFullYear(), state.viewMonth.getMonth()+1, 1);
      state.expanded = false;
      render();
    });

    // 分类网格：点一下选中该分类（金额键盘输入的账就归到它）
    document.getElementById('quickbar').addEventListener('click', function(e){
      var b = e.target.closest('.qbtn');
      if(!b) return;
      if(b.dataset.act === 'quick'){
        renderTmplGrid();
        openSheet('tmplSheet');
        return;
      }
      var k = b.dataset.cat;
      var cat = null;
      for(var i=0;i<CATS.length;i++) if(CATS[i].k === k) cat = CATS[i];
      if(!cat) return;
      state.draft.cat = k;
      // 分类自带收支属性时自动切换；通用分类（给于/其他）保持当前收支
      if(cat.t === 'income' || cat.t === 'expense') state.draft.type = cat.t;
      renderEntry();
      var card = document.getElementById('entryCard');
      if(card && card.scrollIntoView) card.scrollIntoView({ behavior:'smooth', block:'start' });
    });

    // 菜单
    document.querySelector('.menu-list').addEventListener('click', function(e){
      var b = e.target.closest('.mi');
      if(!b) return;
      var m = b.dataset.m;
      closeSheet('menuSheet');
      setTimeout(function(){
        if(m === 'xlsx') exportXLSX();
        else if(m === 'csv') exportCSV();
        else if(m === 'backup') backupJSON();
        else if(m === 'restore') restoreJSON();
        else if(m === 'clear') clearAll();
      }, 200);
    });

    // 模板网格
    document.getElementById('tmplGrid').addEventListener('click', function(e){
      var edit = e.target.closest('.edit-badge');
      if(edit){
        e.stopPropagation();
        openTplEdit(parseInt(edit.dataset.edit, 10));
        return;
      }
      var card = e.target.closest('.tmpl-card');
      if(!card) return;
      var i = parseInt(card.dataset.i, 10);
      var t = state.templates[i];
      if(t) recordFromTemplate(t);
      else openTplEdit(i);
    });

    // 模板编辑
    document.querySelectorAll('#tplSeg button').forEach(function(b){
      b.addEventListener('click', function(){
        var t = b.dataset.t;
        if(state.tplDraft.type === t) return;
        state.tplDraft.type = t;
        state.tplDraft.cat = defaultCatFor(t);
        syncTplEdit();
      });
    });
    document.getElementById('tplCats').addEventListener('click', function(e){
      var b = e.target.closest('.cm');
      if(!b) return;
      state.tplDraft.cat = b.dataset.k;
      syncTplEdit();
    });
    document.getElementById('tplName').addEventListener('input', function(e){ state.tplDraft.name = e.target.value; });
    document.getElementById('tplAmount').addEventListener('input', function(e){
      state.tplDraft.amount = e.target.value.replace(/[^\d.]/g, '');
    });
    document.getElementById('tplNote').addEventListener('input', function(e){ state.tplDraft.note = e.target.value; });
    document.getElementById('tplSave').addEventListener('click', saveTpl);
    document.getElementById('tplDelete').addEventListener('click', clearTpl);

    // 记一笔：类型切换
    document.querySelectorAll('#typeSeg button').forEach(function(b){
      b.addEventListener('click', function(){
        var t = b.dataset.t;
        if(state.draft.type === t) return;
        state.draft.type = t;
        state.draft.cat = defaultCatFor(t);
        renderEntry();
      });
    });

    // 键盘（常驻）
    document.querySelector('.keys').addEventListener('click', function(e){
      var b = e.target.closest('button[data-k]');
      if(!b) return;
      keyPress(b.dataset.k);
    });

    // 日期
    document.getElementById('dateInput').addEventListener('change', function(e){
      state.draft.date = e.target.value || ymd(new Date());
      renderEntry();
    });

    // 流水点击 + 更多按钮
    document.getElementById('groups').addEventListener('click', function(e){
      var more = e.target.closest('.more-btn');
      if(more){
        state.expanded = true;
        render();
        return;
      }
      var it = e.target.closest('.item');
      if(it) openDetail(it.dataset.id);
    });

    // 键盘快捷键（电脑上用：数字键输入、退格删除、回车保存）
    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape'){ closeAll(); return; }
      if(document.querySelector('.sheet.on')) return;   // 弹层打开时不响应
      if(e.target.tagName === 'INPUT') return;
      if(/^[0-9]$/.test(e.key)) keyPress(e.key);
      else if(e.key === '.') keyPress('.');
      else if(e.key === 'Backspace'){ e.preventDefault(); keyPress('del'); }
      else if(e.key === 'Enter'){ if(!document.getElementById('saveBtn').disabled) commit(); }
    });
  }

  /* ---------- 启动 ---------- */
  load();
  renderQuickbar();
  resetDraft();
  bind();
  renderEntry();
  render();

  // 注册 Service Worker（仅 http/https 下生效，本地 file:// 打开会自动跳过）
  if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
