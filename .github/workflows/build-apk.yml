# 记账本 MoneyBook —— 云端自动编译 APK
# 触发方式 1：push 到 main 分支且 android/ 下有改动
# 触发方式 2：GitHub 网页上手动点 Run workflow
# 产物：Actions 运行页面底部的 Artifacts → MoneyBook-debug-apk（解压即 app-debug.apk）
name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**']
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: 编译 Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: MoneyBook-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
